<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Simulateur de crochetage - Mobile & Timer Alerte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .ui { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,0.95); padding: 10px; border-radius: 6px; z-index: 2; max-width: 260px; }
    .hint { font-size: 13px; color: #222; margin-bottom:4px; }
    label { font-size: 13px; display:block; margin-top:4px; }
    button { margin-top: 6px; }
    #tensionBar { width: 100%; height: 10px; background: #ddd; border-radius: 4px; margin-top: 4px; position: relative; }
    #tensionLevel { height: 100%; background: #4CAF50; width: 0%; border-radius: 4px; transition: width 0.1s; }
    #tensionButtons { margin-top: 5px; display:flex; justify-content:space-between; }
    .tension-btn { flex:1; margin:2px; padding:6px; font-size:14px; border-radius:4px; }
  </style>
</head>
<body>
  <div class="ui">
    <div class="hint"><strong>Simulateur de crochetage</strong></div>
    <div class="hint">Utilisez sliders pour goupilles et boutons ou flèches pour tension.</div>
    <div id="pinsSliders"></div>
    <label>Tension</label>
    <div id="tensionBar"><div id="tensionLevel"></div></div>
    <div id="tensionButtons">
      <button class="tension-btn" id="incTension">+</button>
      <button class="tension-btn" id="decTension">-</button>
    </div>
    <div id="timerText" style="font-size:12px;margin-top:4px;color:#222">Temps: 0.0 s</div>
    <button id="resetBtn">Réinitialiser</button>
  </div>

  <a-scene id="scene" background="color: #cfe6ff" shadow="type: pcfsoft">
    <a-entity id="cameraRig" position="0 1.6 1.5">
      <a-entity camera look-controls></a-entity>
    </a-entity>

    <!-- Add a strong directional light for photorealistic shadows -->
    <a-entity light="type: directional; color: #fff; intensity: 1.25; castShadow: true; shadowCameraLeft: -2; shadowCameraRight: 2; shadowCameraBottom: -2; shadowCameraTop: 2; shadowMapWidth: 2048; shadowMapHeight: 2048"
      position="1.5 4 2" rotation="-60 30 0"></a-entity>
    <a-entity light="type: ambient; intensity: 0.5"></a-entity>
    <!-- Secondary spotlights to fill out the scene softly -->
    <a-entity light="type: spot; intensity: 0.35; angle:40; penumbra:0.6; position:1 2 1" cast-shadow="true"></a-entity>
    <a-entity light="type: spot; intensity: 0.35; angle:40; penumbra:0.6; position:-1 2 1" cast-shadow="true"></a-entity>
    
    <a-plane rotation="-90 0 0" width="10" height="10" color="#eaf2ff" id="ground" shadow="receive: true" material="roughness:0.7; metalness:0.05;"></a-plane>
    <a-entity id="lock" position="0 0.8 -0.8" scale="1 1 1">
      <a-box id="body" depth="0.6" height="0.9" width="1.1" color="#555" material="metalness:0.7; roughness:0.38" shadow="cast: true"></a-box>
      <a-torus id="shackle" radius="0.45" radius-tubular="0.05" arc="180" rotation="0 0 0" position="0 0.45 0" material="color:#cfcfcf; metalness:0.95; roughness:0.12" shadow="cast: true"></a-torus>
      <a-cylinder id="plug" radius="0.18" height="0.55" color="#222" material="metalness:0.55; roughness:0.15" position="0 -0.05 0.31" rotation="90 0 0" shadow="cast: true"></a-cylinder>
      <a-box width="0.7" height="0.2" depth="0.05" position="0 0.15 0.34" color="#111" shadow="cast: true"></a-box>
      <a-entity id="pins" position="-0.28 0.15 0.365"></a-entity>
      <a-entity id="statusText" position="0 -0.6 0" text="value: Prêt; align: center; width: 3; color:#000"></a-entity>
    </a-entity>
    <a-sky color="#dff4ff" id="sky"></a-sky>
  </a-scene>

  <script>
    const sceneEl = document.getElementById('scene');
    sceneEl.addEventListener('loaded', init);

    function init() {
      const degToRad = (angleDeg) => {
        if (window.AFRAME && AFRAME.THREE && AFRAME.THREE.Math && typeof AFRAME.THREE.Math.degToRad === 'function') {
          return AFRAME.THREE.Math.degToRad(angleDeg);
        }
        return angleDeg * Math.PI / 180;
      };

      const PIN_COUNT = 5;
      const PIN_SPACING = 0.14;
      const PIN_MAX = 0.12;

      let pins = [];
      let tension = 0;
      let unlocked = false;
      let timer = 0;
      let alertActive = false;
      let alertTimeout = null;

      const pinsContainer = document.querySelector('#pins');
      const pinsSlidersContainer = document.getElementById('pinsSliders');
      const tensionLevel = document.getElementById('tensionLevel');
      const timerText = document.getElementById('timerText');
      const sky = document.getElementById('sky');

      pinsContainer.innerHTML = '';
      pinsSlidersContainer.innerHTML = '';

      for (let i = 0; i < PIN_COUNT; i++) {
        const pin = document.createElement('a-cylinder');
        pin.setAttribute('radius', '0.025');
        pin.setAttribute('height', '0.08');
        pin.setAttribute('color', '#f2d7c9');
        pin.setAttribute('position', `${i * PIN_SPACING} 0 0`);
        pin.pinState = { index: i, depth: 0 };
        pin.requiredDepth = Math.random() * 0.6 + 0.3;
        pin.setAttribute('shadow', 'cast: true');
        // More realistic pin material
        pin.setAttribute('material', 'metalness:0.60; roughness:0.21; color:#f2d7c9');
        pins.push(pin);
        pinsContainer.appendChild(pin);

        const label = document.createElement('label');
        label.innerText = `Goupille ${i + 1} (prof: ${pin.requiredDepth.toFixed(2)})`;
        const slider = document.createElement('input');
        slider.type = 'range'; slider.min = 0; slider.max = 1; slider.step = 0.01; slider.value = 0; slider.style.width = '220px';
        slider.addEventListener('input', e => {
          if (tension < 0.9) {
            pin.pinState.depth = parseFloat(e.target.value);
            updatePin(pin);
            checkUnlock();
            resetAlert();
          }
        });
        pinsSlidersContainer.appendChild(label);
        pinsSlidersContainer.appendChild(slider);
        pinsSlidersContainer.appendChild(document.createElement('br'));
      }

      const plug = document.querySelector('#plug');
      const shackle = document.querySelector('#shackle');
      const statusText = document.querySelector('#statusText');

      function updatePin(pin) {
        const y = pin.pinState.depth * PIN_MAX;
        pin.setAttribute('position', `${pin.pinState.index * PIN_SPACING} ${y} 0`);
        pin.setAttribute('color', pin.pinState.depth > 0.8 ? '#7ef89e' : '#f2d7c9');
      }

      function updateTension() {
        const targetRotation = degToRad(tension * 10);
        const startRotation = plug.object3D.rotation.z;
        const duration = 200;
        const startTime = performance.now();
        function animate() {
          const elapsed = performance.now() - startTime;
          const t = Math.min(elapsed / duration, 1);
          const eased = t * t * (3 - 2 * t);
          plug.object3D.rotation.z = startRotation + (targetRotation - startRotation) * eased;
          if (t < 1) requestAnimationFrame(animate);
        }
        animate();
        tensionLevel.style.width = `${Math.round(tension * 100)}%`;
        if (tension < 0.1) { pins.forEach(p => { p.pinState.depth = 0; updatePin(p); }); }
        statusText.setAttribute('text', 'value', `Tension: ${Math.round(tension * 100)}%`);
      }

      function checkUnlock() { if (unlocked) return; if (pins.every(p => p.pinState.depth >= p.requiredDepth - 0.05) && tension > 0.2) unlock(); }
      function unlock() {
        unlocked = true;
        statusText.setAttribute('text', 'value', 'Déverrouillé !');
        let t = 0;
        const anim = setInterval(() => {
          t += 0.02;
          const newY = 0.45 + t * 0.8;
          shackle.object3D.position.y = newY;
          if (t > 1.4) clearInterval(anim);
        }, 20);
      }

      function resetLock() {
        unlocked = false;
        tension = 0;
        pins.forEach(p => { p.pinState.depth = 0; updatePin(p); });
        updateTension();
        statusText.setAttribute('text', 'value', 'Réinitialisé');
        shackle.object3D.position.y = 0.45;
      }

      function triggerAlert() {
        alertActive = true;
        sky.setAttribute('color', '#ff4c4c');
        alertTimeout = setTimeout(() => {
          if (alertActive) { tension = 0; updateTension(); sky.setAttribute('color', '#dff4ff'); alertActive = false; }
        }, 2000);
      }

      function resetAlert() {
        if (alertActive) {
          clearTimeout(alertTimeout);
          alertActive = false;
          sky.setAttribute('color', '#dff4ff');
          timer = 0;
        }
      }

      document.querySelector('#resetBtn').addEventListener('click', resetLock);
      document.getElementById('incTension').addEventListener('click', () => { tension = Math.min(tension + 0.02, 1); updateTension(); resetAlert(); });
      document.getElementById('decTension').addEventListener('click', () => { tension = Math.max(tension - 0.02, 0); updateTension(); resetAlert(); });

      window.addEventListener('keydown', e => {
        if (e.key === 'ArrowRight') { tension = Math.min(tension + 0.02, 1); updateTension(); resetAlert(); }
        if (e.key === 'ArrowLeft') { tension = Math.max(tension - 0.02, 0); updateTension(); resetAlert(); }
      });

      setInterval(() => {
        timer += 0.1;
        timerText.innerText = `Temps: ${timer.toFixed(1)} s`;
        if (timer > 3 && !alertActive) { triggerAlert(); }
      }, 100);

      pins.forEach(p => updatePin(p));
      updateTension();
    }
  </script>
</body>
</html>
