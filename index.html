<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Simulateur de crochetage - A-Frame (Version améliorée)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; }
    .ui { position: absolute; left: 10px; top: 10px; background: rgba(255,255,255,0.9); padding: 10px; border-radius: 6px; z-index: 2; }
    .hint { font-size: 13px; color: #222; }
    button { margin-top: 6px; }
  </style>
</head>
<body>
  <div class="ui">
    <div class="hint"><strong>Simulateur de crochetage (A-Frame)</strong></div>
    <div class="hint">Instructions : utilisez la souris ou le doigt pour manipuler le crochet et la tension.</div>
    <button id="resetBtn">Réinitialiser</button>
  </div>

  <a-scene background="color: #cfe6ff">
    <a-entity id="cameraRig" position="0 1.6 3">
      <a-entity camera look-controls>
        <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactable"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.01; radiusOuter: 0.015"
                  material="color: black; shader: flat"></a-entity>
      </a-entity>
    </a-entity>
    </a-entity>

    <a-plane rotation="-90 0 0" width="10" height="10" color="#eaf2ff"></a-plane>
    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.7" position="1 2 1"></a-entity>

    <!-- CADENAS 3D AMÉLIORÉ -->
    <a-entity id="lock" position="0 1 -1" scale="1 1 1">

      <!-- Corps du cadenas (métal réaliste) -->
      <a-box id="body" depth="0.6" height="0.9" width="1.1" color="#555" material="metalness:0.6; roughness:0.3" position="0 0 0">
      </a-box>

      <!-- Arceau (shackle) réaliste avec torus -->
      <a-torus id="shackle" radius="0.45" radius-tubular="0.05" arc="180" rotation="0 0 0" position="0 0.45 0" material="color:#cfcfcf; metalness:0.8; roughness:0.2"></a-torus>

      <!-- Cylindre intérieur (plug) -->
      <a-cylinder id="plug" radius="0.18" height="0.55" color="#222" material="metalness:0.5; roughness:0.5" position="0 -0.05 0.31" rotation="90 0 0"></a-cylinder>

      <!-- Pins visibles dans la fenêtre -->
      <a-box width="0.7" height="0.2" depth="0.05" position="0 0.15 0.34" color="#111"></a-box>
      <a-entity id="pins" position="-0.28 0.15 0.365"></a-entity>

      <!-- Crochet (pick) -->
      <a-entity id="pick" class="interactable" position="-1 0.15 0.36" geometry="primitive: box; depth: 0.02; height:0.02; width:0.6" material="color:#e05c3b; metalness:0.2; roughness:0.6"></a-entity>

      <!-- Clef de tension (wrench) -->
      <a-entity id="wrench" class="interactable" position="1 0.1 0.36" geometry="primitive: box; depth: 0.02; height:0.03; width:0.25" material="color:#333; metalness:0.3"></a-entity>

      <a-entity id="statusText" position="0 -0.6 0" text="value: Prêt; align: center; width: 3; color:#000"></a-entity>
    </a-entity>

    <a-sky color="#dff4ff"></a-sky>
  </a-scene>

  <script>
    const PIN_COUNT = 5;
    const PIN_SPACING = 0.14;
    const PIN_MAX = 0.12;

    let pins = [];
    let tension = 0;
    let unlocked = false;

    const pinsContainer = document.querySelector('#pins');
    for (let i = 0; i < PIN_COUNT; i++){
      const pin = document.createElement('a-cylinder');
      pin.setAttribute('radius','0.025');
      pin.setAttribute('height','0.08');
      pin.setAttribute('color','#f2d7c9');
      pin.setAttribute('position', `${i*PIN_SPACING} 0 0`);
      pin.classList.add('interactable');
      pin.pinState = { index:i, depth:0 };
      pins.push(pin);
      pinsContainer.appendChild(pin);
    }

    const pick = document.querySelector('#pick');
    const wrench = document.querySelector('#wrench');
    const plug = document.querySelector('#plug');
    const statusText = document.querySelector('#statusText');
    const shackle = document.querySelector('#shackle');

    // ---- DRAG LOGIQUE SIMPLE POUR PICK ----
    let draggingPick = false;

    pick.addEventListener('mousedown', ()=>{
      draggingPick = true;
    });
    window.addEventListener('mouseup', ()=> draggingPick = false);

    window.addEventListener('mousemove', ev=>{
      if (!draggingPick) return;

      // déplacer le crochet horizontalement
      const xNorm = (ev.clientX / window.innerWidth) * 2 - 1;
      const xPos = xNorm * 0.8; // amplitude
      pick.object3D.position.x = xPos;

      // détecter pin proche
      const closest = pins.reduce((best,p)=>{
        const px = p.object3D.position.x + pinsContainer.object3D.position.x - 0.28;
        const dist = Math.abs(px - xPos);
        return dist < best.dist ? {pin:p, dist} : best;
      },{pin:null,dist:999}).pin;

      if (closest){
        // profondeur basée sur Y de la souris
        const depth = Math.max(0, Math.min(1, 1 - ev.clientY / window.innerHeight));
        closest.pinState.depth = depth;
        updatePin(closest);
        checkUnlock();
      }
    });

    // ---- TENSION ----
    wrench.addEventListener('mousedown', ()=>{
      tension = Math.min(1, tension + 0.15);
      updateWrench();
      checkUnlock();
    });

    window.addEventListener('keydown', e=>{
      if (e.key.toLowerCase()==='t'){
        tension=Math.min(1,tension+0.1);
        updateWrench();
        checkUnlock();
      }
    });

    function updatePin(pin){
      const y = pin.pinState.depth * PIN_MAX;
      pin.setAttribute('position', `${pin.pinState.index*PIN_SPACING} ${y} 0`);
      pin.setAttribute('color', pin.pinState.depth > 0.8 ? '#7ef89e' : '#f2d7c9');
    }

    function updateWrench(){
      plug.object3D.rotation.z = THREE.Math.degToRad(tension * 10);
      statusText.setAttribute('text','value',`Tension: ${Math.round(tension*100)}%`);
    }

    function checkUnlock(){
      if (unlocked) return;
      if (pins.every(p => p.pinState.depth >= p.requiredDepth - 0.05) && tension > 0.2){ unlock(); }
    }

    function unlock(){
      unlocked = true;
      statusText.setAttribute('text','value','Déverrouillé !');
      let t = 0;
      const anim = setInterval(()=>{
        t += 0.02;
        shackle.object3D.position.y = 0.45 + t*0.8;
        if(t>=1) clearInterval(anim);
      },16);
    }

    function resetLock(){
      unlocked = false;
      tension = 0;
      pins.forEach(p=>{ p.pinState.depth = 0; p.requiredDepth = Math.random()*0.6 + 0.3; updatePin(p); });
      shackle.object3D.position.set(0,0.45,0);
      updateWrench();
      statusText.setAttribute('text','value','Réinitialisé');
    }

    document.querySelector('#resetBtn').addEventListener('click', resetLock);

    // Initialisation
    pins.forEach(p=>{ p.requiredDepth = Math.random()*0.6 + 0.3; updatePin(p); });
    updateWrench();
  </script>
</body>
</html>
